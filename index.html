/* ═══════════════════════════════════════════════════════════════════════
   ZOYA SAYEEDA AHMED — one portfolio, six design eras.

   The same content re-rendered in the visual language of 1960, 1984, 1996,
   2007, 2015 and 2026. Brand palette: burgundy, black, white, with 1960 as a
   deliberate exception in phosphor green.

   Her real photographs appear from 1984 onward, rendered the way that display
   could actually have shown them: 1-bit dithered bitmaps in 1984, full colour
   from 1996. 1960 carries no images at all, because that terminal had no
   raster capability.

   Glossy gradients, large radii, tiled backgrounds, marquees and CRT glow
   are period pastiche and deliberate. Contrast is not: every text pair is
   verified ≥ 4.5:1 in _dev/hexcontrast.mjs.
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  --script: 'Noto Sans Devanagari', 'Noto Sans Kannada', 'Noto Naskh Arabic';
  --shell: min(1080px, 100% - 2.5rem);
  --z-content: 1; --z-top: 30; --z-skip: 60;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);

  /* Brand */
  --black: #0A0608;  --ink: #0C0709;   --white: #FFFFFF;  --offwhite: #F6F2F3;
  --b-deep: #5A0F1E; --b-main: #7B1526; --b-mid: #9B1B30;
  --b-bright: #E4657A; --b-pale: #F2DDE1;
  --body: #3A3034;   --muted: #655A5E;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--black); overflow-x: hidden; }
/* height:auto is required alongside the width/height attributes, or `width:100%`
   keeps the attribute's pixel height and stretches the image. */
img { max-width: 100%; display: block; height: auto; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p, ul, ol, dl { margin: 0; }
ul { list-style: none; padding: 0; }
figure { margin: 0; }

.skip {
  position: fixed; top: .5rem; left: .5rem; z-index: var(--z-skip);
  background: var(--white); color: var(--black); padding: .7rem 1.1rem;
  font: 600 .9rem/1 system-ui, sans-serif; text-decoration: none; transform: translateY(-200%);
}
.skip:focus-visible { transform: none; }
:where(a, button, [tabindex]):focus-visible { outline: 3px solid currentColor; outline-offset: 2px; }
[hidden] { display: none !important; }

/* ── Sticky chrome ────────────────────────────────────────────────────── */
.top {
  position: sticky; top: 0; z-index: var(--z-top);
  background: var(--black); color: var(--offwhite);
  border-bottom: 1px solid #2A1E22;
  font-family: 'Archivo', var(--script), system-ui, sans-serif;
}
.top__in {
  width: var(--shell); margin-inline: auto; padding-block: .5rem;
  display: flex; align-items: center; gap: .75rem 1rem; flex-wrap: wrap;
}
.top__mark { font-weight: 700; font-size: .95rem; letter-spacing: -.01em; text-decoration: none; color: inherit; white-space: nowrap; }
.top__mark span { color: var(--b-bright); }

/* The decade switcher: a segmented control, active year raised as a white tab. */
.years {
  margin-inline: auto; display: flex; gap: .15rem; padding: .28rem;
  background: #1C1216; border: 1px solid #33262A; border-radius: 14px;
  overflow-x: auto; scrollbar-width: none; max-width: 100%;
}
.years::-webkit-scrollbar { display: none; }
.years a {
  padding: .5rem .95rem; border-radius: 9px; text-decoration: none; white-space: nowrap;
  font-size: .88rem; font-weight: 700; letter-spacing: .01em; color: #C9BFC2;
  transition: background-color 180ms var(--ease), color 180ms var(--ease);
}
.years a:hover { background: #2A1E22; color: var(--white); }
.years a[aria-current='true'] { background: var(--white); color: var(--b-main); }

.langbar { display: flex; gap: .25rem; }
.langbar button {
  font-family: inherit; font-size: .8rem; font-weight: 600; cursor: pointer;
  color: #C9BFC2; background: transparent; border: 1px solid #33262A;
  padding: .38rem .6rem; border-radius: 6px; min-height: 30px;
  transition: color 180ms var(--ease), background-color 180ms var(--ease), border-color 180ms var(--ease);
}
.langbar button:hover { color: var(--white); border-color: #5A4449; }
.langbar button[aria-pressed='true'] { background: var(--offwhite); color: var(--black); border-color: var(--offwhite); }

/* ── Opening: the language gate ───────────────────────────────────────── */
.gate {
  position: relative; z-index: var(--z-content);
  background: var(--black); color: var(--offwhite);
  padding-block: clamp(3rem, 9vh, 5.5rem);
  font-family: 'Archivo', var(--script), system-ui, sans-serif;
}
.gate__in {
  width: var(--shell); margin-inline: auto;
  display: grid; gap: clamp(2rem, 5vw, 3.5rem); align-items: center;
  grid-template-columns: minmax(0, 1fr);
}
@media (min-width: 880px) { .gate__in { grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); } }
.gate h1 {
  font-size: clamp(2.2rem, 1rem + 5.6vw, 4.5rem);
  font-variation-settings: 'wdth' 88, 'wght' 780; letter-spacing: -.03em; line-height: 1.03;
}
.gate__role { color: var(--b-bright); font-size: clamp(1rem, .9rem + .7vw, 1.35rem); font-weight: 600; margin-top: .9rem; }
.gate__pick { font-size: .78rem; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; color: #A9989D; margin-top: clamp(2rem, 5vh, 3rem); }
.gate__langs { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: .9rem; }
.gate__langs button {
  font-family: 'Archivo', var(--script), system-ui, sans-serif;
  font-size: clamp(.95rem, .9rem + .4vw, 1.2rem); font-weight: 600; cursor: pointer;
  background: transparent; color: var(--offwhite); border: 1px solid #3E2E33;
  padding: .65rem 1.25rem; border-radius: 8px;
  transition: background-color 200ms var(--ease), color 200ms var(--ease), border-color 200ms var(--ease);
}
.gate__langs button:hover { border-color: var(--b-bright); color: var(--b-bright); }
.gate__langs button[aria-pressed='true'] { background: var(--b-bright); color: var(--black); border-color: var(--b-bright); }
.gate__hint { color: #C9BFC2; margin-top: clamp(2rem, 5vh, 3rem); max-width: 44ch; line-height: 1.55; }
.gate__acts { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 1.4rem; }
.gate__down, .gate__cv {
  display: inline-block; text-decoration: none; font-weight: 600; font-size: .92rem;
  padding: .65rem 1.2rem; border-radius: 8px;
}
.gate__down { background: var(--b-main); color: var(--white); }
.gate__down:hover { background: var(--b-mid); }
.gate__cv { border: 1px solid #3E2E33; color: var(--offwhite); }
.gate__cv:hover { border-color: var(--offwhite); }
.gate__photo { border-radius: 10px; overflow: hidden; border: 1px solid #33262A; }
.gate__photo img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 62% 38%; }

/* ── One decade at a time ─────────────────────────────────────────────────
   Each era is its own page, reached from the switcher. Gated behind .js so
   that with JavaScript off all six simply stack and remain readable. */
.js .era, .js .gate { display: none; }
.js .era.is-active, .js .gate.is-active { display: block; }
.js .era.is-active { animation: viewIn 320ms var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.era:focus { outline: none; }

/* Sequential navigation at the foot of each decade. Deliberately the site's
   own chrome rather than the era's, so it reads as leaving that world. */
.jump {
  background: var(--black); color: var(--offwhite);
  font-family: 'Archivo', var(--script), system-ui, sans-serif;
  padding-block: clamp(2rem, 6vh, 3.5rem);
}
.jump__in { width: var(--shell); margin-inline: auto; display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; }
.jump__now { font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #A9989D; }
.jump__links { display: flex; flex-wrap: wrap; gap: .6rem; }
.jump a {
  text-decoration: none; font-weight: 700; font-size: .95rem;
  padding: .7rem 1.3rem; border-radius: 8px; border: 1px solid #3E2E33; color: var(--offwhite);
  transition: background-color 180ms var(--ease), border-color 180ms var(--ease), color 180ms var(--ease);
}
.jump a:hover { border-color: var(--b-bright); color: var(--b-bright); }
.jump a.jump--next { background: var(--b-main); border-color: var(--b-main); color: #fff; }
.jump a.jump--next:hover { background: var(--b-mid); border-color: var(--b-mid); color: #fff; }

.egg-slot { width: var(--shell); margin-inline: auto; padding-block: clamp(1.5rem, 4vh, 2.5rem); }
.era { position: relative; z-index: var(--z-content); scroll-margin-top: 3.5rem; padding-block: clamp(3rem, 8vh, 6rem); }
.era__in { width: var(--shell); margin-inline: auto; }
.era__stamp {
  font-family: 'Archivo', var(--script), system-ui, sans-serif;
  font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: baseline; margin-bottom: 2rem;
}
.era__note { font-weight: 400; letter-spacing: .02em; text-transform: none; opacity: .82; }
[dir='rtl'] { text-align: right; }
.grid-2 { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

/* ═══ 1960 · MAINFRAME TERMINAL ═══════════════════════════════════════
   Green phosphor, and no images at all: the display had no raster capability.
   The page is a terminal session that opens on a dial-in gate. Green is a
   deliberate exception to the burgundy brand, because it is the colour this
   hardware physically emitted. */
#e1960 {
  background: #030A05; color: #4CFF7A;
  font-family: 'VT323', var(--script), ui-monospace, monospace;
  font-size: clamp(1.15rem, 1rem + .6vw, 1.5rem); line-height: 1.35;
  text-shadow: 0 0 6px rgba(76, 255, 122, .35);
}
/* Scanlines: a physical artifact of the display, not decoration. */
#e1960::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,.30) 2px 4px);
  mix-blend-mode: multiply;
}
/* The slow refresh band drifting down the tube. */
#e1960 .crt-sweep {
  position: fixed; left: 0; right: 0; top: 0; height: 150px; pointer-events: none; z-index: 2;
  background: linear-gradient(rgba(76,255,122,0), rgba(76,255,122,.055), rgba(76,255,122,0));
  animation: sweep 7.5s linear infinite;
}
@keyframes sweep { from { transform: translateY(-150px); } to { transform: translateY(100vh); } }

/* The dial-in gate. */
#e1960 .logon { text-align: center; padding: clamp(1.5rem, 6vh, 4rem) 0 clamp(2rem, 6vh, 3.5rem); }
#e1960 .logon h1 { font-size: clamp(1.25rem, 1rem + 1.9vw, 2.1rem); font-weight: 400; letter-spacing: .16em; text-transform: uppercase; line-height: 1.3; }
#e1960 .logon .spec { color: #2FA85A; letter-spacing: .12em; margin-top: .5rem; text-transform: uppercase; }
#e1960 .logon .conn {
  display: inline-block; margin-top: 1.5rem; background: #4CFF7A; color: #030A05;
  padding: .45rem 2.4rem; letter-spacing: .18em; text-shadow: none; text-transform: uppercase;
}
#e1960 .logon .hint { color: #268A4A; margin-top: .9rem; letter-spacing: .14em; text-transform: uppercase; font-size: .82em; }

/* Session transcript: a command line, then the output block it produced. */
#e1960 .cmd { color: #2FA85A; margin: 1.7rem 0 .5rem; letter-spacing: .04em; }
#e1960 .cmd b { color: #4CFF7A; font-weight: 400; }
#e1960 .t-box { border: 2px solid #2FA85A; padding: 1rem 1.15rem; margin-bottom: .4rem; }
#e1960 .t-box > h2 {
  font-size: 1em; font-weight: 400; text-transform: uppercase; letter-spacing: .1em;
  color: #030A05; background: #4CFF7A; display: inline-block;
  padding: 0 .5rem; margin: -1rem 0 .85rem -1.15rem; text-shadow: none;
}
#e1960 .t-kv { display: grid; grid-template-columns: minmax(0, 12rem) minmax(0, 1fr); gap: .1rem 1rem; }
#e1960 .t-kv dt { text-transform: uppercase; color: #2FA85A; }
#e1960 .t-kv dd { margin: 0; color: #B8FFCF; }
#e1960 .t-rec { margin-bottom: 1.15rem; }
#e1960 .t-rec > b { font-weight: 400; text-transform: uppercase; letter-spacing: .05em; display: block; }
#e1960 .t-rec > i { font-style: normal; color: #2FA85A; display: block; font-size: .88em; }
#e1960 li { color: #B8FFCF; }
#e1960 li::before { content: '  > '; white-space: pre; color: #2FA85A; }
#e1960 [dir='rtl'] li::before { content: ' < '; }
#e1960 p { max-width: 68ch; }
#e1960 a { color: #B8FFCF; }
#e1960 .t-cursor::after { content: '█'; margin-left: .15em; animation: blink 1.05s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#e1960 .eof { color: #268A4A; letter-spacing: .12em; margin-top: 1.7rem; text-transform: uppercase; }

/* ═══ 1984 · ONE-BIT GRAPHICAL INTERFACE ═════════════════════════════ */
#e1984 {
  background: #B9B9B9; color: #000;
  /* System 1 used Chicago for chrome and Geneva for body; setting long prose
     in the bitmap display face is both unreadable and inauthentic. */
  font-family: Geneva, Verdana, var(--script), sans-serif;
  background-image: repeating-linear-gradient(0deg, #fff 0 1px, #B9B9B9 1px 2px);
}
#e1984 .w__title, #e1984 h1, #e1984 h3, #e1984 .era__stamp {
  font-family: 'Silkscreen', var(--script), ui-monospace, monospace;
}
#e1984 .era__stamp { color: #000; }
#e1984 .w { background: #fff; border: 2px solid #000; margin-bottom: 1.5rem; box-shadow: 5px 5px 0 #000; }
#e1984 .w__bar {
  border-bottom: 2px solid #000; padding: .3rem .4rem;
  display: flex; align-items: center; gap: .5rem;
  background: repeating-linear-gradient(0deg, #000 0 1px, #fff 1px 3px);
}
#e1984 .w__close { width: 13px; height: 13px; border: 2px solid #000; background: #fff; flex: none; }
#e1984 .w__title { font-size: .74rem; font-weight: 700; background: #fff; padding: 0 .5rem; text-transform: uppercase; letter-spacing: .04em; }
#e1984 .w__body { padding: 1rem 1.15rem 1.2rem; font-size: .84rem; line-height: 1.62; }
#e1984 .w__body p { max-width: 72ch; }
#e1984 h1 { font-size: clamp(1.35rem, .9rem + 2.2vw, 2.4rem); line-height: 1.25; letter-spacing: -.01em; }
#e1984 .w__body h3 { font-size: .78rem; margin-bottom: .25rem; letter-spacing: .02em; }
#e1984 li { padding-left: 1.1rem; position: relative; }
#e1984 li::before { content: '\25AA'; position: absolute; left: 0; }
#e1984 [dir='rtl'] li { padding: 0 1.1rem 0 0; }
#e1984 [dir='rtl'] li::before { left: auto; right: 0; }
#e1984 dl { display: grid; grid-template-columns: minmax(0, 9rem) minmax(0, 1fr); gap: .1rem .75rem; }
#e1984 dt { font-weight: 700; }
#e1984 dd { margin: 0; }
#e1984 a { color: #000; }
#e1984 .w--split .w__body { display: grid; gap: 1.1rem 1.4rem; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
/* One bit deep: the photographs are Floyd–Steinberg dithered to pure black
   and white, and scaled with hard pixels the way the hardware would. */
#e1984 .bmp { border: 2px solid #000; background: #fff; }
#e1984 .bmp img { width: 100%; height: auto; image-rendering: pixelated; }
#e1984 .bmp figcaption { border-top: 2px solid #000; padding: .35rem .5rem; font-size: .68rem; font-family: 'Silkscreen', var(--script), monospace; }
#e1984 .w-hero { display: grid; gap: 1.2rem; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { #e1984 .w-hero { grid-template-columns: minmax(0, 1fr) 200px; align-items: start; } }

/* ═══ 1996 · THE EARLY WEB ═══════════════════════════════════════════ */
#e1996 {
  color: #000; font-family: 'Times New Roman', Times, var(--script), serif;
  font-size: 1.0625rem; line-height: 1.5;
  background-color: #DCD4D6;
  background-image:
    radial-gradient(circle at 6px 6px, #C9BEC1 1.5px, transparent 1.6px),
    radial-gradient(circle at 18px 18px, #E8E1E3 1.5px, transparent 1.6px);
  background-size: 24px 24px;
}
#e1996 .era__stamp { color: #3A3034; }
#e1996 .w96 { background: #fff; border: 3px ridge #A8969A; padding: 1.25rem 1.4rem; margin-bottom: 1.25rem; }
#e1996 h1 { font-size: clamp(1.8rem, 1.1rem + 3.2vw, 3rem); text-align: center; color: var(--b-deep); line-height: 1.15; }
#e1996 .c { text-align: center; }
#e1996 h2 { font-size: 1.45rem; color: var(--b-main); border-bottom: 2px solid var(--b-main); padding-bottom: .2rem; margin-bottom: .7rem; }
#e1996 h3 { font-size: 1.15rem; color: var(--b-deep); }
#e1996 hr { border: 0; border-top: 2px groove #A8969A; margin: 1.1rem 0; }
#e1996 a { color: var(--b-mid); }
#e1996 a:visited { color: var(--b-deep); }
#e1996 li { padding-left: 1.3rem; position: relative; margin-bottom: .2rem; }
#e1996 li::before { content: '\25CF'; position: absolute; left: .25rem; color: var(--b-main); font-size: .7em; top: .45em; }
#e1996 [dir='rtl'] li { padding: 0 1.3rem 0 0; }
#e1996 [dir='rtl'] li::before { left: auto; right: .25rem; }
#e1996 .new {
  font-family: Verdana, sans-serif; font-size: .6rem; font-weight: 700; color: #fff;
  background: var(--b-mid); padding: 1px 5px; vertical-align: middle; margin-inline-start: .4rem; letter-spacing: .06em;
}
#e1996 .mq-wrap { position: relative; margin-bottom: 1.25rem; }
#e1996 .marquee { overflow: hidden; border: 2px inset #A8969A; background: var(--b-deep); color: var(--b-pale); padding: .3rem 0; }
#e1996 .marquee span { display: inline-block; white-space: nowrap; padding-left: 100%; animation: slide 22s linear infinite; font-family: Verdana, sans-serif; font-size: .8rem; }
@keyframes slide { to { transform: translateX(-100%); } }
/* WCAG 2.2.2: auto-scrolling past five seconds needs a stop control, not just
   a reduced-motion fallback. Styled as a period bevelled button. */
#e1996 .mq-btn {
  position: absolute; top: 50%; transform: translateY(-50%); inset-inline-end: .35rem;
  font-family: Verdana, sans-serif; font-size: .62rem; font-weight: 700; line-height: 1;
  background: #C0C0C0; color: #000; border: 2px outset #E8E8E8;
  padding: .3rem .5rem; min-height: 26px; min-width: 32px; cursor: pointer;
}
#e1996 .mq-btn:active { border-style: inset; }
#e1996.mq-paused .marquee span { animation-play-state: paused; }
@media (prefers-reduced-motion: reduce) { #e1996 .mq-btn { display: none; } }
#e1996 .counter {
  display: inline-block; font-family: 'VT323', monospace; font-size: 1.3rem; letter-spacing: .18em;
  background: #000; color: #F0556B; padding: .1rem .5rem; border: 2px inset #666;
}
#e1996 table { width: 100%; border-collapse: collapse; }
#e1996 td { vertical-align: top; padding: .35rem .6rem .35rem 0; }
#e1996 td.lbl { width: 34%; font-weight: 700; color: var(--b-main); }
#e1996 [dir='rtl'] td { padding: .35rem 0 .35rem .6rem; }
#e1996 .snap { border: 3px ridge #A8969A; background: #fff; padding: 4px; }
#e1996 .snap img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; }
#e1996 .snap figcaption { font-size: .8rem; text-align: center; padding-top: .3rem; font-style: italic; }
#e1996 .snaps { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
#e1996 .portrait { float: inline-start; width: min(190px, 40%); margin: 0 1.1rem .6rem 0; }
#e1996 .portrait img { aspect-ratio: 3 / 4; object-fit: cover; }
#e1996 [dir='rtl'] .portrait { margin: 0 0 .6rem 1.1rem; }

/* ═══ 2007 · WEB 2.0 ═════════════════════════════════════════════════ */
#e2007 {
  color: var(--body);
  font-family: 'Lucida Grande', 'Segoe UI', var(--script), Verdana, sans-serif;
  font-size: 0.9375rem; line-height: 1.62;
  background: linear-gradient(#F6E4E8 0%, #FDF7F8 340px, #fff 100%);
}
#e2007 .era__stamp { color: var(--muted); }
#e2007 h1 { font-size: clamp(2rem, 1.3rem + 3.2vw, 3.4rem); line-height: 1.1; letter-spacing: -.02em; color: var(--b-deep); text-shadow: 0 1px 0 #fff; }
#e2007 .tag2 {
  display: inline-block; font-size: .68rem; font-weight: 700; color: #fff; text-transform: uppercase;
  letter-spacing: .08em; padding: .2rem .55rem; border-radius: 10px;

var esc = function (s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
};
var li = function (arr) { return arr.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join(''); };
var stamp = function (t, year) {
  return '<p class="era__stamp"><span>' + year + '</span>' +
         '<span class="era__note">' + esc(t.eraNote[year]) + '</span></p>';
};

   file beats guessing an object-position against a wide scene. */

/* ════════════════ RENDER ════════════════ */
var YEARS = [1960, 1984, 1996, 2007, 2015, 2026];
var root = document.documentElement;
var current = 'en';

function render(code) {
  var base = T[code];
  if (!base) return;
  current = code;
  var t = Object.assign({}, base, { ph: PHOTOS[code] || PHOTOS.en });

  root.lang = t.htmlLang;
  root.dir = 'ltr';   /* chrome stays LTR; only the content blocks flip */

  YEARS.forEach(function (y) {
    var sec = document.getElementById('e' + y);
    var host = y === 2015 ? sec : sec.querySelector('.era__in');
    host.innerHTML = TPL[y](t);
    Array.prototype.forEach.call(sec.children, function () {});
    var stale = sec.querySelectorAll('.egg-slot, .jump');
    Array.prototype.forEach.call(stale, function (n) { if (n.parentNode === sec) n.parentNode.removeChild(n); });
    sec.insertAdjacentHTML('beforeend',
      '<div class="egg-slot"><button type="button" class="dnp" data-egg="' + y + '">' +
      esc(t.ph.egg.label) + '</button></div>' + jumpBar(t, y));
    sec.setAttribute('dir', t.dir);
    sec.setAttribute('lang', t.htmlLang);
  });

  document.getElementById('g-name').textContent = t.name;
  document.getElementById('g-role').textContent = t.role;
  document.getElementById('g-pick').textContent = t.pick;
  document.getElementById('g-hint').textContent = t.hint;
  document.getElementById('g-down').textContent = t.start;
  document.getElementById('g-cv').textContent = t.ph.resume;
  document.getElementById('g-photo').alt = t.ph.alt.hero;
  var gate = document.getElementById('gate');
  gate.setAttribute('dir', t.dir);
  gate.setAttribute('lang', t.htmlLang);

  document.querySelectorAll('.langbar button, .gate__langs button').forEach(function (b) {
    b.setAttribute('aria-pressed', b.dataset.lang === code ? 'true' : 'false');
  });

  try { localStorage.setItem('zsa-lang', code); } catch (e) {}
}

function buildSwitch(host, full) {
  host.innerHTML = Object.keys(T).map(function (code) {
    return '<button type="button" data-lang="' + code + '" aria-pressed="false" lang="' + T[code].htmlLang + '">' +
           esc(full ? T[code].label : T[code].tag) + '</button>';
  }).join('');
  host.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lang]');
    if (!b) return;
    var keep = window.scrollY;
    render(b.dataset.lang);
    window.scrollTo(0, keep);   /* switching language must not throw away your place */
  });
}
buildSwitch(document.getElementById('langbar-top'), false);
buildSwitch(document.getElementById('langbar-gate'), true);

var saved = null;
try { saved = localStorage.getItem('zsa-lang'); } catch (e) {}
render(saved && T[saved] ? saved : 'en');

/* Marquee stop control. Delegated, so it survives a language re-render. */
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-mq]');
  if (!b) return;
  mqPaused = !mqPaused;
  document.getElementById('e1996').classList.toggle('mq-paused', mqPaused);
  var t = T[current];
  b.setAttribute('aria-pressed', mqPaused ? 'true' : 'false');
  b.setAttribute('aria-label', mqPaused ? t.mq.play : t.mq.pause);
  b.textContent = mqPaused ? '▶' : '❚❚';
});

/* ════════════════ ROUTING ════════════════
   One decade at a time. The switcher is the only way between them, and the
   hash keeps them linkable and back-button friendly. */
var onViewChange = null;
var railLinks = Array.prototype.slice.call(document.querySelectorAll('#rail a'));
var gateEl = document.getElementById('gate');
var themeMeta = document.querySelector('meta[name=theme-color]');

function showView(name, push) {
  var isGate = name === 'gate';
  gateEl.classList.toggle('is-active', isGate);
  YEARS.forEach(function (y) {
    document.getElementById('e' + y).classList.toggle('is-active', String(y) === name);
  });
  railLinks.forEach(function (a) {
    a.setAttribute('aria-current', a.getAttribute('href') === '#' + name ? 'true' : 'false');
  });
  var active = isGate ? gateEl : document.getElementById('e' + name);
  if (!active) return;
  themeMeta.setAttribute('content', getComputedStyle(active).backgroundColor);
  if (push) {
    if (location.hash !== '#' + name) history.pushState({ v: name }, '', '#' + name);
    window.scrollTo(0, 0);
    active.setAttribute('tabindex', '-1');
    active.focus({ preventScroll: true });
  }
  if (typeof onViewChange === 'function') onViewChange(name);
}

function viewFromHash() {
  var h = (location.hash || '').replace('#', '');
  if (h === 'gate' || YEARS.indexOf(parseInt(h, 10)) > -1) return h;
  return 'gate';
}

document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href^="#"]');
  if (!a) return;
  var target = a.getAttribute('href').slice(1);
  if (target !== 'gate' && YEARS.indexOf(parseInt(target, 10)) < 0) return;
  e.preventDefault();
  showView(target, true);
});
window.addEventListener('popstate', function () { showView(viewFromHash(), false); window.scrollTo(0, 0); });

/* Router is live once its dependencies above are assigned. */
showView(viewFromHash(), false);

/* Sequential navigation at the foot of each decade. */
function jumpBar(t, year) {
  var i = YEARS.indexOf(year);
  var prev = i > 0 ? YEARS[i - 1] : null;
  var next = i < YEARS.length - 1 ? YEARS[i + 1] : null;
  var links = '';
  if (prev) links += '<a href="#' + prev + '">← ' + prev + '</a>';
  links += '<a href="#gate">' + esc(t.ph.backToStart) + '</a>';
  if (next) links += '<a class="jump--next" href="#' + next + '">' + next + ' →</a>';
  return '<div class="jump"><div class="jump__in">' +
    '<p class="jump__now">' + esc(t.ph.endOf).replace('{year}', year) + '</p>' +
    '<div class="jump__links">' + links + '</div></div></div>';
}

/* ════════════════ "DO NOT PRESS" ════════════════ */
var eggEl = document.getElementById('egg');
var eggTimer = null;

var EGGS = {
  1960: function (t) {
    var lines = ['ILLEGAL INSTRUCTION AT 0x00A4', 'CORE DUMP FOLLOWS', '0x00A4  4F 52 20 44 4F 4E 27 54',
                 '0x00AC  20 50 52 45 53 53 20 49', '0x00B4  54 20 41 47 41 49 4E 2E',
                 'PARITY CHECK 2', 'TAPE DRIVE 1 OFFLINE', 'OPERATOR INTERVENTION REQUIRED'];
    return { cls: 'egg-1960',
      html: lines.map(function (l) { return '<b>&gt; ' + esc(l) + '</b>'; }).join('') +
            '<span class="halt">SYSTEM HALTED</span>' };
  },
  1984: function (t) {
    return { cls: 'egg-1984',
      html: '<div class="box"><div class="bomb">💣</div>' +
            '<h3>Sorry, a system error occurred.</h3>' +
            '<p>' + esc(t.ph.egg.told) + '</p><p>ID = 01</p>' +
            '<span class="btn84">Restart</span></div>' };
  },
  1996: function (t) {
    return { cls: 'egg-1996 is-waiting', waiting: true,
      html: '<p class="wait">Please wait while your computer shuts down…</p>',
      then: { cls: 'egg-1996', html: '<p class="safe">It&rsquo;s now safe to turn off<br>your computer.</p>' } };
  },
  2007: function (t) {
    var pops = [
      { x: '8%',  y: '14%', bar: 'Congratulations!', b: 'You are visitor 1,000,000!', p: t.ph.egg.prize },
      { x: '46%', y: '30%', bar: 'Special offer',    b: 'Download our toolbar', p: t.ph.egg.toolbar },
      { x: '20%', y: '52%', bar: 'Alert',            b: 'Your PC may be slow', p: t.ph.egg.slow }
    ];
    return { cls: 'egg-2007',
      html: pops.map(function (o) {
        return '<div class="pop" style="left:' + o.x + ';top:' + o.y + '">' +
               '<div class="pop__bar">' + esc(o.bar) + '</div>' +
               '<div class="pop__body"><b>' + esc(o.b) + '</b>' + esc(o.p) +
               '<div><span class="pop__btn">OK</span></div></div></div>';
      }).join('') };
  },
  2015: function (t) {
    return { cls: 'egg-2015',
      html: '<div><p class="big">' + esc(t.ph.egg.flat) + '</p>' +
            '<div class="rects"><i></i><i></i><i></i></div></div>' };
  },
  2026: function (t) {
    return { cls: 'egg-2026',
      html: '<div><p class="gen">' + esc(t.ph.egg.regen) + '</p>' +
            '<div class="bar"><i></i></div>' +
            '<p class="done">' + esc(t.ph.egg.regenDone) + '</p></div>' };
  }
};

function closeEgg() {
  clearTimeout(eggTimer);
  eggEl.hidden = true;
  eggEl.className = '';
  eggEl.innerHTML = '';
  document.body.style.overflow = '';
}

function openEgg(year) {
  var t = Object.assign({}, T[current], { ph: PHOTOS[current] || PHOTOS.en });
  var make = EGGS[year];
  if (!make) return;
  var spec = make(t);
  var paint = function (s) {
    eggEl.className = s.cls;
    eggEl.innerHTML = s.html + '<p class="egg__hint">' + esc(t.ph.egg.dismiss) + '</p>';
  };
  paint(spec);
  eggEl.hidden = false;
  document.body.style.overflow = 'hidden';
  eggEl.focus && eggEl.setAttribute('tabindex', '-1');
  eggEl.focus && eggEl.focus({ preventScroll: true });
  if (spec.then) eggTimer = setTimeout(function () { paint(spec.then); }, 1800);
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-egg]');
  if (b) { openEgg(b.getAttribute('data-egg')); return; }
  if (!eggEl.hidden && eggEl.contains(e.target)) closeEgg();
});
document.addEventListener('keydown', function (e) {
  if (!eggEl.hidden && (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); closeEgg(); }
});

/* ════════════════ 2026 · generative field ════════════════ */
(function () {
  var cv = document.getElementById('field');
  var ctx = cv && cv.getContext && cv.getContext('2d');
  if (!ctx) return;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  var host = document.getElementById('e2026');
  var W = 0, H = 0, blobs = [], running = false;
  var COLORS = ['#7B1526', '#9B1B30', '#5A0F1E', '#B4283F'];

  function seed() {
    blobs = [];
    for (var i = 0; i < 12; i++) {
      blobs.push({ x: Math.random(), y: Math.random(), r: 0.18 + Math.random() * 0.3,
        c: COLORS[i % COLORS.length], a: 0.2,
        px: Math.random() * 6.28, py: Math.random() * 6.28,
        sx: 0.00008 + Math.random() * 0.00015, sy: 0.00008 + Math.random() * 0.00015,
        ax: 0.05 + Math.random() * 0.1, ay: 0.05 + Math.random() * 0.1 });
    }
  }
  function size() {
    var d = Math.min(window.devicePixelRatio || 1, 1.5);
    var r = host.getBoundingClientRect();
    W = cv.width = Math.max(1, Math.floor(r.width * d));
    H = cv.height = Math.max(1, Math.floor(r.height * d));
  }
  function draw(ts) {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'screen';
    var m = Math.max(W, H);
    blobs.forEach(function (b) {
      var x = (b.x + Math.sin(ts * b.sx + b.px) * b.ax) * W;
      var y = (b.y + Math.cos(ts * b.sy + b.py) * b.ay) * H;
      var rr = b.r * m;
      var g = ctx.createRadialGradient(x, y, 0, x, y, rr);
      g.addColorStop(0, b.c); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = b.a; ctx.beginPath(); ctx.arc(x, y, rr, 0, 6.2832);
      ctx.fillStyle = g; ctx.fill();
    });
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  function loop(ts) { draw(ts); if (running) requestAnimationFrame(loop); }
  function start() {
    if (reduced.matches) { running = false; draw(8000); return; }
    if (running) return; running = true; requestAnimationFrame(loop);
  }
  seed(); size();
  // Only runs while 2026 is the visible page.
  onViewChange = function (name) { if (name === '2026') { size(); start(); } else { running = false; } };
  if (document.getElementById('e2026').classList.contains('is-active')) start(); else draw(8000);

  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt); rt = setTimeout(function () { size(); if (!running) draw(8000); }, 160);
  });
  reduced.addEventListener('change', function () { running = false; setTimeout(start, 20); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) running = false; else start();
  });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (e) {
      if (e[0].isIntersecting) { size(); start(); } else { running = false; }
    }, { threshold: 0 }).observe(host);
  }
})();

})();
